<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio lab</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    main {
      flex-direction: column; gap: 12px; padding: 12px;
      overflow-y: auto; justify-content: flex-start;
    }
    .panel {
      background: #1c1c1c; border: 1px solid #333; border-radius: 10px;
      padding: 12px; max-width: 720px; width: 100%;
    }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .modes button, #startBtn, #sweepBtn, #clearBtn {
      padding: 10px 18px; font-size: 15px; border-radius: 8px;
      border: 1px solid #444; background: #242424; color: #eee;
    }
    .modes button.active { background: #2d4a68; border-color: #3987e5; }
    #startBtn { background: #2c4a2c; border-color: #4a7a4a; }
    button:disabled { opacity: 0.4; }
    .ctl { display: grid; grid-template-columns: 78px 1fr 76px; gap: 8px; align-items: center; }
    .ctl label { font-size: 13px; color: #9a9a9a; }
    .ctl output {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px; text-align: right;
    }
    input[type=range] { width: 100%; }
    .sweep-cfg { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: #9a9a9a; }
    .sweep-cfg label { display: flex; flex-direction: column; gap: 2px; }
    .sweep-cfg input { width: 72px; background: #111; color: #eee; border: 1px solid #444; border-radius: 5px; padding: 4px 6px; }
    .readouts { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
    /* Hero figure: the number the room is watched through. */
    #bigSnr { font-size: 40px; font-weight: 600; }
    #liveSnr, #detCount { font-size: 13px; color: #9a9a9a; }
    #selfHeard, #constraints, #follow { font-size: 13px; color: #9a9a9a; }
    .good { color: #4fbf6f !important; }
    .bad { color: #c86a6a !important; }
    canvas { display: block; width: 100%; background: #1c1c1c; border-radius: 6px; }
    #waveCv { height: 80px; }
    #specCv { height: 200px; }
    #corrCv { height: 110px; }
    #snrCv { height: 140px; }
    #sweepCv { height: 170px; }
    #rangeCv { height: 170px; }
    #tdoaCv { height: 150px; }
    #dist { font-size: 40px; font-weight: 600; }
    #distMed { font-size: 13px; color: #9a9a9a; }
    h3 { font-size: 13px; font-weight: 600; color: #9a9a9a; margin: 2px 0 6px; }
  </style>
</head>
<body>
  <header>
    <a class="home" href="/" title="Back to start">Audio lab</a>
    <span id="status" class="grow">connecting…</span>
  </header>
  <main>
    <div class="panel">
      <div class="row">
        <span class="modes">
          <button id="modeChirp" type="button">Chirp</button>
          <button id="modeListen" type="button">Listen</button>
          <button id="modeRange" type="button">Range</button>
          <button id="modeBeacon" type="button">Beacon</button>
        </span>
        <button id="startBtn" type="button">Start</button>
        <button id="sweepBtn" type="button" disabled>Start sweep</button>
        <button id="rangeGoBtn" type="button" disabled>Initiate rounds</button>
        <button id="clearBtn" type="button">Clear</button>
      </div>
      <div class="readouts" style="margin-top:10px">
        <span id="bigSnr">—</span>
        <span id="dist"></span>
        <span id="distMed"></span>
        <span id="liveSnr"></span>
        <span id="detCount">0 detections</span>
        <span id="selfHeard"></span>
      </div>
      <div id="constraints"></div>
      <div id="follow"></div>
    </div>

    <div class="panel">
      <div class="ctl">
        <label for="f0">chirp f0</label>
        <input id="f0" type="range" min="2000" max="23000" step="250">
        <output id="f0Val"></output>
        <label for="f1">chirp f1</label>
        <input id="f1" type="range" min="2000" max="23000" step="250">
        <output id="f1Val"></output>
        <label for="dur">duration</label>
        <input id="dur" type="range" min="20" max="150" step="5">
        <output id="durVal"></output>
        <label for="interval">interval</label>
        <input id="interval" type="range" min="250" max="3000" step="250">
        <output id="intervalVal"></output>
        <label for="gain">volume</label>
        <input id="gain" type="range" min="-60" max="0" step="1">
        <output id="gainVal"></output>
        <label for="thresh">threshold</label>
        <input id="thresh" type="range" min="10" max="40" step="1">
        <output id="threshVal"></output>
      </div>
      <h3 style="margin-top:10px">Auto sweep</h3>
      <div class="sweep-cfg">
        <label>start Hz<input id="swStart" type="number" step="500"></label>
        <label>top Hz<input id="swTop" type="number" step="500"></label>
        <label>band Hz<input id="swBand" type="number" step="500"></label>
        <label>step Hz<input id="swStep" type="number" step="500"></label>
        <label>chirps/step<input id="swPer" type="number" min="1" max="20"></label>
      </div>
      <h3 style="margin-top:10px">Ranging</h3>
      <div class="sweep-cfg">
        <label>spk↔mic bias m<input id="rangeBias" type="number" step="0.01" min="-1" max="1"></label>
      </div>
      <h3 style="margin-top:10px">Beacon</h3>
      <div class="sweep-cfg">
        <label>speaker baseline m<input id="beaconBase" type="number" step="0.05" min="0.1" max="5"></label>
        <label>L→R offset ms<input id="beaconOff" type="number" step="50" min="150" max="1000"></label>
      </div>
    </div>

    <div class="panel"><h3>Microphone</h3><canvas id="waveCv"></canvas></div>
    <div class="panel"><h3>Spectrogram</h3><canvas id="specCv"></canvas></div>
    <div class="panel"><h3>Matched-filter correlation</h3><canvas id="corrCv"></canvas></div>
    <div class="panel"><h3>Detection SNR over time</h3><canvas id="snrCv"></canvas></div>
    <div class="panel"><h3>SNR by frequency band</h3><canvas id="sweepCv"></canvas></div>
    <div class="panel"><h3>Distance</h3><canvas id="rangeCv"></canvas></div>
    <div class="panel"><h3>Beacon bearing</h3><canvas id="tdoaCv"></canvas></div>
  </main>
  <script src="/common.js"></script>
  <script src="/experiments/fft.js"></script>
  <script src="/experiments/audio-lab.js"></script>
</body>
</html>
