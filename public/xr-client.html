<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synora XR Client</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    main { flex-direction: column; gap: 12px; padding: 12px; overflow-y: auto; justify-content: flex-start; }
    #report {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px; white-space: pre-line; color: #bbb; max-width: 640px;
    }
    .yes { color: #4fbf6f; }
    .no { color: #c86a6a; }
    button.wide { padding: 8px 16px; font-size: 15px; }
    /* This element is the domOverlay root, and in an AR session the UA forces
       the root to fill the viewport — any inset/background/padding put here is
       discarded for the duration, which is why styling it could never move the
       text off the punch-hole. It is only a transparent full-screen container;
       the readable chip is the child. */
    #overlay {
      position: fixed; inset: 0; z-index: 20; display: none;
    }
    #overlay.on { display: block; }
    /* Everything visible lives in here, and this is the only element with a
       size of its own: viewport units, so it cannot take part in the loop that
       once grew the map to four million pixels (a canvas with no resolvable CSS
       size reports its backing store as its client size, the backing store is
       set from the client size, and the root then stretches to the canvas). Its
       children size and position against *it*, in percentages.
       It also carries the rotation. The phone's orientation lock keeps the
       layout portrait however the device is held, which is how the user wants
       it — so the screen is turned the other way instead, by the angle read off
       ARCore's gravity in xr-client.js. The transform makes this the containing
       block for the children, so one rotation moves map, camera and buttons
       together and nothing has to know it happened. */
    #overlayRot {
      position: fixed; left: 50%; top: 50%;
      width: 100vw; height: 100dvh;
      transform: translate(-50%, -50%) rotate(0deg);
      transform-origin: 50% 50%;
    }
    #overlay.rot90 #overlayRot,
    #overlay.rot270 #overlayRot { width: 100dvh; height: 100vw; }
    #overlay.rot90 #overlayRot { transform: translate(-50%, -50%) rotate(90deg); }
    #overlay.rot180 #overlayRot { transform: translate(-50%, -50%) rotate(180deg); }
    #overlay.rot270 #overlayRot { transform: translate(-50%, -50%) rotate(-90deg); }
    #overlayText {
      position: absolute;
      /* Clear the status bar and the punch-hole camera. env() covers the
         status bar where the UA reports it; the constant is the camera cutout,
         which no inset describes. */
      top: calc(env(safe-area-inset-top, 0px) + 56px);
      /* Shrink-wrapped to the longest line it is actually showing. A block fills
         whatever width it is given, so capping it was not enough — edge to edge
         or capped at 440px, a chip of short monospace lines is mostly black.
         The cap stays as the ceiling for the one long sentence in the
         tracking-lost message. */
      left: 8px; right: auto;
      width: fit-content;
      max-width: min(380px, calc(100% - 16px));
      background: rgba(0,0,0,0.72); border-radius: 6px; padding: 10px;
      font-family: ui-monospace, monospace; font-size: 10px; color: #eee;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      /* The whole chip is one button. No double-tap zoom to wait for, and a
         press-and-hold selects nothing — both of which the tap handler used to
         cancel by hand, at the cost of cancelling the event that does the work. */
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
      transition: transform 220ms ease, opacity 220ms ease;
    }
    /* Tapped, the chip leaves: it is five lines of diagnostics sitting over the
       map this screen exists to draw, and it is not wanted there all the time.
       Gone means gone — the chip slides off its own edge of the screen and takes
       no taps with it. There is no folded-down state left to aim at — a mark
       small enough to be out of the way turned out to be one the finger could
       not reliably hit inside the session, three attempts running, so the way
       back is the button in the row where every tap on this page lands. Slid
       rather than switched off, so it is visibly the same chip going and coming
       back and not two different things appearing. */
    #overlayText.away {
      transform: translateX(calc(-100% - 16px));
      opacity: 0;
      pointer-events: none;
    }
    /* Turned sideways it is anchored to the other edge, so it leaves by it. */
    #overlay.rot90 #overlayText.away,
    #overlay.rot270 #overlayText.away {
      transform: translateX(calc(100% + 16px));
    }
    /* The line breaks belong to the report, not to the chip: on the container
       they also applied to the markup between the chip's own two children. */
    #overlayTextBody { white-space: pre-line; }
    /* Turned sideways the chip goes to the top right. The 56px above is the
       punch-hole camera, which is on the portrait top edge and nowhere near
       this one, so it goes; the safe-area inset would describe the unturned
       screen and is dropped for the same reason.
       Held clear of the button column, which owns this same edge from top to
       bottom: the buttons are bottom-anchored, so the two only met when the chip
       grew — the tracking-lost message wraps to twice the usual height — and
       then the row, being later in the document at the same z-index, drew over
       the report. The column is 36 wide at an 8 inset, so 52 clears it. */
    #overlay.rot90 #overlayText,
    #overlay.rot270 #overlayText {
      left: auto; right: 52px; top: 8px;
      max-width: min(380px, calc(100% - 60px));
    }
    /* The room map, drawn on the phone so the survey can be read while walking
       it. Under .blank-screen (z-index 100), so blanking still covers
       everything; over the passthrough, which is behind the whole overlay. */
    /* dvh, not vh or a bottom inset: the Android navigation bar comes and goes
       and the map has to end where the screen does either way. */
    /* No CSS background: the backdrop is painted by the renderer, which is what
       lets it be turned off — a background here would still be opaque under a
       cleared canvas. */
    #mapCanvas {
      position: absolute; left: 0; width: 100%; display: none;
      z-index: 30;
    }
    #mapCanvas.split { display: block; top: 50%; height: 50%; }
    #mapCanvas.full { display: block; top: 0; height: 100%; }
    /* The camera, scaled down, for when the map has the whole screen. The AR
       passthrough cannot be shrunk — the UA composites it behind the entire
       overlay — but the detector already reads the camera image back every
       detection frame, so this is that image at a tenth of the size and is
       also exactly what the tag detector is looking at. */
    /* Bottom right, clear of both the buttons under it and the text chip up
       top: those are the two things that must stay readable over the map. */
    #camCanvas {
      position: absolute; display: none;
      right: 8px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 64px);
      width: 30%; height: auto; z-index: 35;
      border-radius: 6px; border: 1px solid rgba(255,255,255,0.25);
    }
    #camCanvas.on { display: block; }
    /* Out of the way of the button column, and smaller: 30% of a landscape box
       is a third of the long edge, which is a much bigger picture than the same
       number upright. */
    #overlay.rot90 #camCanvas,
    #overlay.rot270 #camCanvas {
      right: auto; left: 8px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
      width: 18%;
    }
    /* Above the map: the chip is the diagnostic surface and the buttons are the
       only way back out of a full-screen map. */
    #overlayText, #overlayBtns { z-index: 40; }
    /* One row, one set of edge insets — the buttons moved as a group when the
       screen turned, and three separate anchors meant three places to get that
       wrong. Upright they run along the bottom, clear of the gesture bar.
       Right-anchored, and the map-only controls sit at the left-hand end: they
       appear and disappear with the map, under the user's thumb, and from this
       end they push nothing that was already there — Map, Stream and
       Blank keep the exact spot they had before the map was turned on. Same rule
       as the column below, which anchors at its bottom for the same reason. */
    #overlayBtns {
      position: absolute;
      left: 8px; right: 8px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      display: flex; align-items: flex-end; justify-content: flex-end;
      gap: 6px;
    }
    /* The label a button no longer carries, shown for a moment when it is
       pressed. One element rather than a caption per button: at this size a row
       of legends is the text the icons replaced, and what is wanted is only the
       answer to "what did I just press, and what is it now". It sits over the
       map above the row, out of the way of the thumb that raised it. */
    #btnToast {
      position: absolute; z-index: 40;
      left: 8px; right: 8px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 60px);
      text-align: right;
      font-family: ui-monospace, monospace; font-size: 11px;
      pointer-events: none;
      opacity: 0; transition: opacity 160ms linear;
    }
    #btnToast.on { opacity: 1; }
    #btnToast span {
      display: inline-block;
      background: rgba(0,0,0,0.72); color: #eee;
      border-radius: 6px; padding: 4px 8px;
    }
    /* Sideways the row is a column down the right-hand edge, so the flash goes
       beside its bottom end rather than above it. */
    #overlay.rot90 #btnToast,
    #overlay.rot270 #btnToast {
      right: 52px; bottom: 8px; left: 8px;
    }
    /* Turned sideways they stack down the right-hand edge instead: the bottom
       of a landscape screen is where Android's own bars sit, and a row of
       buttons across it is both cramped and in their way. */
    #overlay.rot90 #overlayBtns,
    #overlay.rot270 #overlayBtns {
      left: auto; right: 8px;
      top: 8px; bottom: 8px;
      /* Bottom of the column, not the middle: the chip now has the top of this
         same edge, and centred buttons reached up into it.
         `stretch` is what makes the column one width — the box is shrink-wrapped
         to its widest child, and every button then fills it. */
      flex-direction: column; justify-content: flex-end; align-items: stretch;
    }
    /* Bottom up: Blank, Stream, Map, then the three the map brings
       with it. The map-only buttons appear and disappear under the user's thumb,
       and anchored from the bottom of the column they push nothing that was
       already there — the four permanent ones keep the exact spot they had
       before the map was turned on. */
    #overlay.rot90 #headingBtn, #overlay.rot270 #headingBtn { order: 1; }
    #overlay.rot90 #transparentBtn, #overlay.rot270 #transparentBtn { order: 2; }
    #overlay.rot90 #fitBtn, #overlay.rot270 #fitBtn { order: 3; }
    #overlay.rot90 #mapBtn, #overlay.rot270 #mapBtn { order: 4; }
    #overlay.rot90 #streamBtn, #overlay.rot270 #streamBtn { order: 6; }
    #overlay.rot90 #blankBtn, #overlay.rot270 #blankBtn { order: 7; }
    #overlay.rot90 #reportBtn, #overlay.rot270 #reportBtn { order: 8; }
    /* The look is style.css's — one description of a control for the whole app.
       What is set here is what the passthrough changes about it: the fill goes
       from a light film (which lifts a control off dark chrome) to a dark pill
       (which holds contrast against a bright camera image), and the pressed fill
       has to go *lighter* for the same reason. The blur only reaches page
       pixels — the map canvas under it — since the passthrough is composited
       behind the whole overlay and nothing here can touch it, so on this page
       the fill is what carries the contrast on its own.
       No border: at this size a hairline on every one of a tight row of pills
       read as a row of boxes rather than as controls. */
    #overlayBtns {
      --btn-fill: rgba(22, 22, 24, 0.62);
      --btn-fill-hover: rgba(40, 40, 44, 0.68);
      --btn-fill-press: rgba(70, 70, 74, 0.72);
      --btn-line: transparent;
      --btn-line-hover: transparent;
      --btn-on-line: transparent;
      --btn-radius: 2px;
    }
    /* Icons, not words. Seven labelled controls across a phone left each one
       nine-pixel text, which is neither readable at arm's length nor a target
       worth aiming at; a square glyph is both. The name is not lost — it is
       flashed in #btnToast on the press, which is the moment it is wanted.
       `.icon-btn` is style.css's, so these are the same control the client page
       and the dashboard use, at the same size, with the overlay's own fill. */
    #overlayBtns button {
      flex: 0 0 auto;
      /* A finger's worth of button around a 20px glyph — the same 36px square
         `.icon-btn` gives the client page, spelled out here because a row of
         them has to stay square as the column stretches them sideways. */
      width: 36px; height: 36px;
      padding: 0;
    }
    /* Touch-only surface, and every button here is a toggle that already says
       what it is by its fill. A tap leaves focus sitting on the button, so any
       focus styling stays lit long after the press and reads as an on-state —
       the one thing this row must not be ambiguous about. */
    #overlayBtns button:focus, #overlayBtns button:focus-visible,
    #overlayBtns:focus-within,
    #exitBtn:focus, #exitBtn:focus-visible {
      outline: none;
    }
    /* Out of the session, back to the page with the Start button on it. Anchored
       on its own rather than given a place in the button row: the row is the
       overlay's own controls, all of them about what is being drawn, while this
       one leaves — and a fifth equal column would not fit `Transparent` across a
       phone at this size anyway. It takes the corner diagonally opposite the
       chip in both orientations, which is also where a close box is looked for
       and the furthest thing on screen from the thumb resting on the row. */
    /* The one control here that is not a pane of glass: no fill, no edge, no
       shadow, and no blur either — a blurred pane with nothing filling it is
       still a visible square. It is a mark on the passthrough rather than a
       button on a panel, which is what a close box is, and it is the reason it
       does not take the overlay's fill tokens. The drop shadow is then the only
       thing holding it against a bright camera image, and does the job the fill
       does everywhere else. */
    #exitBtn {
      position: absolute; z-index: 40;
      /* Level with the chip, and past the punch-hole camera for the same
         reason — see #overlayText. */
      top: calc(env(safe-area-inset-top, 0px) + 56px);
      right: 8px;
      flex: none;
      /* Box and mark are sized separately: the ✕ is 16px, the target it sits in
         the middle of is a finger wide. Nothing is drawn on the box, so it can
         be as big as a touch needs without looking it. */
      width: 46px; height: 46px;
      padding: 0; line-height: 1;
      /* Same monospace as the chip and the rest of the overlay — this is an
         instrument panel, not chrome. */
      font-family: ui-monospace, monospace;
      font-size: 16px;
      /* No double-tap zoom to wait for, and no chance of the press being taken
         for the start of a pan. */
      touch-action: manipulation;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    }
    /* Nothing to darken, so the press shows as the mark itself fading. */
    #exitBtn:active {
      opacity: 0.55;
    }
    /* Turned sideways the chip moves to the top right, so this moves to the
       opposite end of the same edge. The two turns are not mirror images here:
       Android keeps drawing its status bar along the phone's *physical* top edge
       whatever the page's orientation lock says, and that edge is this box's
       left at rot90 and its right at rot270. At a flat 8px the close box sat
       under the clock and the battery — measured on the device. The offset is
       taken from the safe-area *top* inset for the same reason: the insets
       describe the unturned screen, so top is the one that means "status bar"
       however far this box has been turned. */
    #overlay.rot90 #exitBtn {
      right: auto; left: calc(env(safe-area-inset-top, 0px) + 48px); top: 8px;
    }
    #overlay.rot270 #exitBtn {
      left: auto; right: calc(env(safe-area-inset-top, 0px) + 48px); top: 8px;
    }
    /* Only while there is a map for them to act on. Carried on the row rather
       than on each button, because `.on` on a button is style.css's *toggled*
       state and would light these three green just for being visible. */
    #transparentBtn, #headingBtn, #fitBtn { display: none; }
    #overlayBtns.mapOn #transparentBtn,
    #overlayBtns.mapOn #headingBtn,
    #overlayBtns.mapOn #fitBtn { display: inline-flex; }
  </style>
</head>
<body>
  <header>
    <a class="home" href="/" title="Back to start">XR client</a>
    <span id="clientLabel"></span>
    <span id="status" class="grow">checking…</span>
  </header>
  <main>
    <div id="report">probing…</div>
    <button id="startBtn" class="wide" type="button" disabled>Start XR session</button>
  </main>
  <div id="overlay">
    <div id="overlayRot">
      <canvas id="mapCanvas"></canvas>
      <canvas id="camCanvas"></canvas>
      <div id="overlayText"><span id="overlayTextBody"></span></div>
      <button id="exitBtn" type="button" title="End the XR session">✕</button>
      <div id="btnToast"><span></span></div>
      <!-- The map-only three first, so they appear and disappear at the end of
           the row furthest from the controls that are always there. -->
      <div id="overlayBtns">
        <button id="transparentBtn" class="icon-btn" type="button"
                title="Map backdrop" aria-label="Map backdrop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="3.5" width="17" height="17" rx="2"/>
            <path d="M3.5 14.5l11-11"/>
            <path d="M9.5 20.5l11-11"/>
          </svg>
        </button>
        <button id="headingBtn" class="icon-btn" type="button"
                title="Heading up" aria-label="Heading up">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l7 17-7-4.2L5 20z"/>
          </svg>
        </button>
        <!-- Zoom in, said the way every map says it: a magnifier with a plus.
             What this control changes is how close the view sits, so the glyph
             is about closeness rather than about the pose it closes in on. -->
        <button id="fitBtn" class="icon-btn" type="button"
                title="Zoom to what is in view" aria-label="Zoom to what is in view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"/>
            <path d="M15.4 15.4L21 21"/>
            <path d="M10.5 7.5v6"/>
            <path d="M7.5 10.5h6"/>
          </svg>
        </button>
        <!-- A folded paper map, the one glyph that is not a picture of what it
             draws — the room map is what every other control here acts on. -->
        <button id="mapBtn" class="icon-btn" type="button"
                title="Room map" aria-label="Room map">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 3.5L3.5 6v14.5L9 18l6 2.5 5.5-2.5V3.5L15 6z"/>
            <path d="M9 3.5V18"/>
            <path d="M15 6v14.5"/>
          </svg>
        </button>
        <!-- The feature cloud, as it is drawn: scattered points. -->
        <!-- The dashboard's own camera-composite glyph: same thing being
             switched, so the same picture of it. -->
        <button id="streamBtn" class="icon-btn" type="button"
                title="Send video" aria-label="Send video">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="6" width="13" height="12" rx="2.5"/>
            <path d="M15.5 10.5l5-3.2v9.4l-5-3.2z"/>
          </svg>
        </button>
        <!-- The client page's own blank-screen glyph, for the same control. -->
        <button id="blankBtn" class="icon-btn" type="button"
                title="Blank screen (keeps tracking)" aria-label="Blank screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3.5a7.5 7.5 0 1 0 10 10z"/>
          </svg>
        </button>
        <!-- Brings the diagnostic chip back after it has been sent away. Bars,
             not an "i": it is a readout of live numbers, not a note about the
             page. -->
        <button id="reportBtn" class="icon-btn" type="button"
                title="Diagnostics" aria-label="Diagnostics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 19.5V11"/>
            <path d="M12 19.5V4.5"/>
            <path d="M19 19.5v-6"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <script src="/common.js"></script>
  <script src="/media-tx.js"></script>
  <script src="/cv-common.js"></script>
  <script src="/pose-math.js"></script>
  <script src="/detect-core.js"></script>
  <script src="/anim.js"></script>
  <script src="/map2d.js"></script>
  <script src="/room-feed.js"></script>
  <script src="/xr-client.js"></script>
</body>
</html>
