<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebXR Probe</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    main { flex-direction: column; gap: 12px; padding: 12px; overflow-y: auto; justify-content: flex-start; }
    #report, #live {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px; white-space: pre-line; color: #bbb; max-width: 640px;
    }
    .yes { color: #4fbf6f; }
    .no { color: #c86a6a; }
    button.wide { padding: 8px 16px; font-size: 15px; }
    /* The in-session overlay: the phone is in AR, so this is the only way to
       read anything while walking. */
    #overlay {
      position: fixed; inset: auto 8px 8px 8px; z-index: 20;
      background: rgba(0,0,0,0.72); border-radius: 6px; padding: 10px;
      font-family: ui-monospace, monospace; font-size: 13px; color: #eee;
      white-space: pre-line; display: none;
    }
    #overlay.on { display: block; }
    #overlay button { margin-right: 8px; padding: 6px 12px; }
  </style>
</head>
<body>
  <header>
    <a class="home" href="/" title="Back to start">WebXR probe</a>
    <span id="status" class="grow">checking…</span>
  </header>
  <main>
    <div id="report">probing…</div>
    <button id="startBtn" class="wide" type="button" disabled>Start AR session</button>
    <div id="live"></div>
  </main>
  <div id="overlay">
    <div id="overlayText"></div>
    <button id="markBtn" type="button">Mark origin</button>
    <button id="endBtn" type="button">End</button>
  </div>
  <script src="/xr-probe.js"></script>
</body>
</html>
