<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synora Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="tight">
    <a class="home" href="/" title="Back to start">Dashboard</a>
    <span id="status" class="grow">connecting…</span>
    <!-- The room's only metric datum, in the header rather than behind a click:
         every distance on this page scales by it, a wrong one is invisible in
         everything downstream (the room just comes out uniformly too big), and
         the number itself is the printed tag someone is holding. Click to open
         the drawer where it is set. -->
    <span id="tagSizeLabel" title="Printed tag edge — click to change"></span>
    <span id="syncLabel"></span>
    <!-- Views | room overlays | the drawer. Nothing here destroys anything —
         the two wipes live in the drawer, beside the tag list they empty. -->
    <button id="sceneBtn" class="toggle">3D</button>
    <button id="map2dBtn" class="toggle">Top</button>
    <!-- The two elevations differ only in which room axis runs across the
         screen; the axis gizmo in each one's corner says which. -->
    <button id="sideBtn" class="toggle" title="Elevation across x">Side</button>
    <button id="frontBtn" class="toggle" title="Elevation across z">Front</button>
    <span class="sep"></span>
    <button id="poseBtn" class="toggle">Pose</button>
    <button id="wallsBtn" class="toggle">Walls</button>
    <span class="sep"></span>
    <button id="drawerBtn" class="icon-btn compact" type="button" title="Drawer" aria-label="Drawer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4.5" width="18" height="15" rx="2"/>
        <path d="M14.5 4.5v15"/>
      </svg>
    </button>
  </header>
  <main>
    <div id="stage">
      <div id="grid"></div>
      <div id="backdrop"></div>
      <div id="roomViews">
        <canvas id="scene"></canvas>
        <div id="maps2d">
          <canvas id="map2d"></canvas>
          <canvas id="mapSide"></canvas>
          <canvas id="mapFront"></canvas>
        </div>
        <div id="roomStats"></div>
      </div>
    </div>
    <div id="drawer">
      <!-- Controls for what the drawer itself holds: the composite below, the
           audio of the feeds it shows, and the two wipes that forget the survey
           and the carve the tag list under here is made of. All were in the
           header, where they sat among the view toggles — a row of things that
           change what is drawn, with two that destroy what it is drawn from. The
           panel appends the roster and the tags after these, so they stay at the
           top. -->
      <div id="drawerTools">
        <!-- The two wipes read as one pair: the same strike over the thing being
             forgotten, a surveyed tag and a carved cell. Red before they are
             even reached for — the two-click arming says "this one, now", the
             colour says "these two are not like the others". Held at the far end
             of the row from the controls that only change what is shown, so the
             pointer never passes over one on its way to the other. -->
        <button id="clearTagsBtn" class="icon-btn compact danger" type="button" title="Clear tags" aria-label="Clear tags">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8"/>
            <path d="M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8"/>
            <path d="M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16"/>
            <path d="M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/>
            <rect x="9" y="9" width="6" height="6"/>
            <path d="M3.5 20.5l17-17"/>
          </svg>
        </button>
        <button id="clearCarveBtn" class="icon-btn compact danger" type="button" title="Clear carve" aria-label="Clear carve">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="4" width="16" height="16" rx="1.5"/>
            <path d="M12 4v16"/>
            <path d="M4 12h16"/>
            <path d="M3.5 20.5l17-17"/>
          </svg>
        </button>
        <span class="grow"></span>
        <button id="combinedBtn" class="icon-btn compact" type="button" title="Camera composite" aria-label="Camera composite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="6" width="13" height="12" rx="2.5"/>
            <path d="M15.5 10.5l5-3.2v9.4l-5-3.2z"/>
          </svg>
        </button>
        <button id="muteBtn" class="icon-btn compact" type="button" title="Feed audio" aria-label="Feed audio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/>
            <path d="M15.3 9.4a4 4 0 0 1 0 5.2"/>
            <path d="M17.9 6.9a7.5 7.5 0 0 1 0 10.2"/>
            <path class="slash" d="M3.5 3.5l17 17"/>
          </svg>
        </button>
      </div>
      <canvas id="combined" width="1920" height="1080"></canvas>
      <!-- Server settings. Static here, above whatever the panel appends, and
           built from the schema the server sends rather than from a list of
           fields written out twice — a new setting in settings.js turns up here
           on its own. -->
      <div id="settingsCard" class="drawer-card settings">
        <div class="head">
          <span class="name">Server settings</span>
          <span id="settingsStatus" class="at"></span>
        </div>
        <div id="settingsRows"></div>
      </div>
    </div>
  </main>
  <script src="/vendor/three.min.js"></script>
  <script src="/vendor/OrbitControls.js"></script>
  <script src="/common.js"></script>
  <script src="/pose-math.js"></script>
  <script src="/anim.js"></script>
  <script src="/scene.js"></script>
  <script src="/map2d.js"></script>
  <script src="/room-feed.js"></script>
  <script src="/clients-panel.js"></script>
  <script src="/viewer.js"></script>
</body>
</html>
