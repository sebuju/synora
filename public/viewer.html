<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synora Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a class="home" href="/" title="Back to start">Dashboard</a>
    <span id="status" class="grow">connecting…</span>
    <span id="syncLabel"></span>
    <button id="combinedBtn" class="toggle">Cams</button>
    <button id="sceneBtn" class="toggle">3D</button>
    <button id="map2dBtn" class="toggle">Top</button>
    <button id="sideBtn" class="toggle">Side</button>
    <span id="voxelControls" style="display: none">
      <select id="voxelViewSelect" title="Voxels to show: whole map, only the last N keyframes, or none (disables mapping entirely — clients stop sending keyframes, no depth inference)">
        <option value="none">none</option>
        <option value="all" selected>all</option>
        <option value="1">last 1</option>
        <option value="2">last 2</option>
        <option value="3">last 3</option>
        <option value="4">last 4</option>
        <option value="5">last 5</option>
        <option value="6">last 6</option>
        <option value="7">last 7</option>
        <option value="8">last 8</option>
        <option value="9">last 9</option>
        <option value="10">last 10</option>
      </select>
      <button id="clearVoxelsBtn">Clear</button>
    </span>
    <button id="muteBtn" class="toggle">Sound</button>
    <button id="fullscreenBtn">Full</button>
  </header>
  <main>
    <div id="grid"></div>
    <div id="backdrop"></div>
    <canvas id="combined" width="1920" height="1080"></canvas>
    <div id="roomViews">
      <canvas id="scene"></canvas>
      <div id="maps2d">
        <canvas id="map2d"></canvas>
        <canvas id="mapSide"></canvas>
      </div>
      <div id="roomStats"></div>
    </div>
    <div id="empty">No devices connected</div>
  </main>
  <script src="/vendor/three.min.js"></script>
  <script src="/vendor/OrbitControls.js"></script>
  <script src="/common.js"></script>
  <script src="/pose-math.js"></script>
  <script src="/scene.js"></script>
  <script src="/map2d.js"></script>
  <script src="/viewer.js"></script>
</body>
</html>
