<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synora Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a class="home" href="/" title="Back to start">Dashboard</a>
    <span id="status" class="grow">connecting…</span>
    <span id="syncLabel"></span>
    <button id="combinedBtn" class="toggle">Cams</button>
    <button id="sceneBtn" class="toggle">3D</button>
    <button id="map2dBtn" class="toggle">Top</button>
    <button id="sideBtn" class="toggle">Side</button>
    <button id="poseBtn" class="toggle">Pose</button>
    <button id="wallsBtn" class="toggle">Walls</button>
    <button id="clientsBtn" class="toggle">Clients</button>
    <button id="muteBtn" class="toggle">Sound</button>
    <button id="fullscreenBtn">Full</button>
  </header>
  <main>
    <div id="stage">
      <div id="grid"></div>
      <div id="backdrop"></div>
      <div id="roomViews">
        <canvas id="scene"></canvas>
        <div id="maps2d">
          <canvas id="map2d"></canvas>
          <canvas id="mapSide"></canvas>
        </div>
        <div id="roomStats"></div>
      </div>
      <div id="empty">No video feeds</div>
    </div>
    <div id="drawer">
      <canvas id="combined" width="1920" height="1080"></canvas>
    </div>
  </main>
  <script src="/vendor/three.min.js"></script>
  <script src="/vendor/OrbitControls.js"></script>
  <script src="/common.js"></script>
  <script src="/pose-math.js"></script>
  <script src="/scene.js"></script>
  <script src="/map2d.js"></script>
  <script src="/clients-panel.js"></script>
  <script src="/viewer.js"></script>
</body>
</html>
